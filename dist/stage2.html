<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="theme-color" content="#23352c">
<title>개미의 모험 — 제2장 부엌으로 가는 길</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#15261d;font-family:system-ui,'Apple SD Gothic Neo',sans-serif;color:#fff7da;overscroll-behavior:none}
#frame{position:fixed;inset:0;display:block;overflow:hidden;width:100%;height:100%;height:100dvh}#stage{position:absolute;left:50%;top:50%;margin-left:-480px;margin-top:-270px;width:960px;height:540px;transform-origin:center center;overflow:hidden;background:#bad9bf;box-shadow:0 0 60px #0008;visibility:hidden}
canvas{display:block;width:960px;height:540px}
#top{position:absolute;inset:14px 22px auto;display:flex;align-items:flex-start;gap:12px;z-index:2;text-shadow:0 2px 5px #0005;pointer-events:none}
.vitals{width:168px;min-height:78px;border-radius:14px;padding:10px 14px;background:#23372edb;box-shadow:0 5px 16px #0002}.vitals #hearts{color:#ffb1a1;font-size:21px;letter-spacing:3px;white-space:nowrap;line-height:23px}
.spit-row{margin-top:5px;display:flex;align-items:center;gap:8px;font-size:12px}.meter{height:7px;flex:1;background:#14291f;border-radius:8px;overflow:hidden}.meter i{display:block;width:100%;height:100%;background:#a6dbe0;border-radius:8px}
.chapter{position:absolute;left:50%;top:-14px;transform:translateX(-50%);min-width:206px;padding:13px 24px 11px;background:#293b2ccb;border-radius:0 0 16px 16px;text-align:center}.chapter small{display:block;color:#dfdcb7;font-size:10px;letter-spacing:2px}.chapter strong{display:block;color:#fff;font-size:17px;margin-top:3px}
#stats{margin-left:auto;display:flex;align-items:center;gap:14px;padding:7px 9px;background:#23372edb;border-radius:14px;font-size:17px;font-variant-numeric:tabular-nums}
#pause{pointer-events:auto;padding:0;width:64px;height:61px;font-size:24px;border-radius:14px;background:#ffffff10}
#controls{position:absolute;inset:auto 20px 14px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
#controls>div{display:flex;gap:14px;align-items:end;pointer-events:auto}
#controls button{width:99px;height:93px;border-radius:21px;font-size:26px;border:2px solid #fff9;box-shadow:0 4px 0 #26352b44}
#controls .move button{background:rgba(247,242,227,.30);border-color:rgba(255,255,255,.58);color:#344a34;box-shadow:0 3px 0 #26352b25}
#controls .attack{width:111px;height:103px;background:#e6edc9ee;font-size:26px}
#controls .jump{width:120px;height:120px;background:#efc07fee;font-size:26px}
#controls button small{display:block;font-size:10px;opacity:.6;margin-top:4px}
#controls .move button.held{background:rgba(247,242,227,.46)!important}

#modal{position:absolute;inset:0;z-index:5;background:#192c22e9;display:flex;align-items:center;justify-content:center}#modal[hidden]{display:none}#card{width:670px;padding:32px 44px;border:1px solid #a0b08a77;border-radius:25px;background:linear-gradient(145deg,#344d3e,#24392f);box-shadow:0 20px 80px #0005;max-height:510px;overflow:auto}#card small{color:#f5d69c;letter-spacing:2px}h1{font-size:35px;letter-spacing:-1px;margin:8px 0;color:#fff0ce}p{font-size:19px;line-height:1.55}#card button{padding:17px 24px;margin:6px 10px 0 0;font-size:18px}#card a{color:#ffdf9d}.dim{opacity:.72;font-size:14px}#toast{position:absolute;top:75px;left:50%;transform:translateX(-50%);background:#213b31df;padding:10px 18px;border-radius:14px;opacity:0;z-index:3}#toast.show{opacity:1}
</style></head>
<body><div id="frame"><main id="stage" aria-label="개미의 모험 두 번째 스테이지">
<canvas id="canvas" width="960" height="540"></canvas>
<header id="top"><div class="vitals"><div id="hearts">♥♥♥</div><div class="spit-row"><span>침</span><div class="meter"><i id="spit-fill"></i></div></div></div><div class="chapter"><small>CHAPTER 02</small><strong>부엌으로 가는 길</strong></div><div id="stats"><span id="clock">00:00</span><button id="pause" aria-label="일시정지">Ⅱ</button></div></header>
<div id="toast" role="status"></div>
<div id="controls"><div class="move"><button data-key="left" aria-label="왼쪽 이동">◀</button><button data-key="right" aria-label="오른쪽 이동">▶</button></div><div><button class="attack" data-key="attack" aria-label="침 뱉기">퉷!<small>Z</small></button><button class="jump" data-key="jump" aria-label="점프">점프<small>SPACE</small></button></div></div>
<section id="modal" hidden><div id="card"><small>ANT ADVENTURE · CHAPTER 02</small><h1 id="heading">부엌으로 가는 길</h1><p id="description">거실을 빠져나오니 거대한 식탁과 설거지 흔적이 기다리고 있습니다.</p><div id="actions"></div><p class="dim" id="note">조작: 좌우 방향키 · 점프 · 침 뱉기. 가시 부스러기와 베짱이를 조심하세요.</p></div></section>
</main></div>
<script type="module" src="stage2.js"></script></body></html>
