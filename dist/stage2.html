<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="theme-color" content="#23352c">
<title>개미의 모험 — 제2장 부엌으로 가는 길</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#15261d;font-family:system-ui,'Apple SD Gothic Neo',sans-serif;color:#fff7da;overscroll-behavior:none}
#frame{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}#stage{position:relative;width:960px;height:540px;flex:none;transform-origin:center;overflow:hidden;background:#bad9bf;box-shadow:0 0 60px #0008;visibility:hidden}
canvas{display:block;width:960px;height:540px}
#top{position:absolute;top:12px;left:20px;right:20px;display:flex;align-items:center;gap:18px;z-index:2;text-shadow:0 2px 4px #0008}#top strong{font-size:18px}#top small{font-size:12px}#stats{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:16px}
button{touch-action:none;border-radius:20px;border:2px solid #fffc;background:#f2efdbdb;color:#344d38;font-weight:900;user-select:none;-webkit-user-select:none}button:active,.held{background:#fff4b1!important}button:focus-visible{outline:4px solid #ecb671}
#pause{padding:9px 18px;font-size:18px}#controls{position:absolute;inset:auto 20px 14px;display:flex;justify-content:space-between;pointer-events:none}#controls>div{display:flex;gap:14px;align-items:end;pointer-events:auto}#controls button{width:112px;height:106px;font-size:31px}#controls .move button{background:#f7f4dc55;border-color:#ffffffbd}#controls .attack{width:132px;height:114px;background:#cde3b5e8}#controls .jump{width:144px;height:138px;background:#f4c88edb}
#modal{position:absolute;inset:0;z-index:5;background:#192c22e9;display:flex;align-items:center;justify-content:center}#modal[hidden]{display:none}#card{width:670px;padding:32px 44px;border:1px solid #ffffff66;border-radius:24px;background:#274635;max-height:510px;overflow:auto}#card small{color:#f5d69c;letter-spacing:2px}h1{font-size:40px;margin:8px 0}p{font-size:19px;line-height:1.55}#card button{padding:17px 24px;margin:6px 10px 0 0;font-size:18px}#card a{color:#ffdf9d}.dim{opacity:.72;font-size:14px}#toast{position:absolute;top:75px;left:50%;transform:translateX(-50%);background:#213b31df;padding:10px 18px;border-radius:14px;opacity:0;z-index:3}#toast.show{opacity:1}
</style></head>
<body><div id="frame"><main id="stage" aria-label="개미의 모험 두 번째 스테이지">
<canvas id="canvas" width="960" height="540"></canvas>
<div id="top"><div><small>CHAPTER 02</small><strong> · 부엌으로 가는 길</strong></div><div id="stats"><span id="hearts">♥♥♥</span><span id="clock">00:00</span><button id="pause">Ⅱ</button></div></div>
<div id="toast" role="status"></div>
<div id="controls"><div class="move"><button data-key="left" aria-label="왼쪽 이동">◀</button><button data-key="right" aria-label="오른쪽 이동">▶</button></div><div><button class="attack" data-key="attack" aria-label="침 뱉기">퉷!</button><button class="jump" data-key="jump" aria-label="점프">점프</button></div></div>
<section id="modal" hidden><div id="card"><small>ANT ADVENTURE · CHAPTER 02</small><h1 id="heading">부엌으로 가는 길</h1><p id="description">거실을 빠져나오니 거대한 식탁과 설거지 흔적이 기다리고 있습니다.</p><div id="actions"></div><p class="dim" id="note">조작: 좌우 방향키 · 점프 · 침 뱉기. 가시 부스러기와 베짱이를 조심하세요.</p></div></section>
</main></div>
<script type="module" src="stage2.js"></script></body></html>
